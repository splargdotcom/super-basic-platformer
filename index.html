<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Basic Platformer v1</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: monospace; }
        canvas { border: 2px solid #fff; image-rendering: pixelated; }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="900" height="500"></canvas>

<script>
// --- GLOBAL SCOPE (Start of script) ---

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Define Game Objects
let gameState = { score: 0, level: 1, cameraX: 0, isGameOver: false, isPaused: false, isStarted: false, particles: [], gameOverReason: '', portalParticleTimer: 0 };
const player = { x: 100, y: 300, width: 40, height: 40, color: '#9bbc0f', velX: 0, velY: 0, grounded: false, health: 3, invincible: false, invincibleTimer: 0 }; // Added invincible
let platforms = [], enemies = [], coins = [], hearts = [], goal = {};
let stompChain = 0;

// Audio Context for retro sounds and music
let audioCtx = null;
let masterGain = null;

function ensureAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.16;
        masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(frequency = 440, duration = 0.1, type = 'square', volume = 0.08, when = 0, slideTo = null) {
    ensureAudio();
    const now = audioCtx.currentTime + when;
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(masterGain);

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, now);
    if (slideTo) oscillator.frequency.linearRampToValueAtTime(slideTo, now + duration);

    gainNode.gain.setValueAtTime(0.0001, now);
    gainNode.gain.exponentialRampToValueAtTime(Math.max(volume, 0.0001), now + 0.01);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    oscillator.start(now);
    oscillator.stop(now + duration + 0.02);
}

function playNoise(duration = 0.08, volume = 0.03, when = 0, filterFreq = 1200) {
    ensureAudio();
    const now = audioCtx.currentTime + when;
    const bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);

    const source = audioCtx.createBufferSource();
    const filter = audioCtx.createBiquadFilter();
    const gainNode = audioCtx.createGain();
    source.buffer = buffer;
    filter.type = 'bandpass';
    filter.frequency.value = filterFreq;
    source.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(masterGain);
    gainNode.gain.setValueAtTime(volume, now);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    source.start(now);
    source.stop(now + duration + 0.01);
}

function playBlip(frequency = 440, duration = 0.1, type = 'square') {
    playTone(frequency, duration, type, 0.07);
}

let musicPlaying = false;
let soundtrackTimer = null;
const soundtrack = {
    tempo: 132,
    step: 0,
    melody: [659, 784, 880, 784, 659, 587, 659, 523, 494, 523, 659, 523, 440, 494, 523, null],
    bass:   [165, 165, 196, 196, 147, 147, 196, 196],
    chords: [330, 392, 294, 392]
};

function stopSoundtrack() {
    musicPlaying = false;
    if (soundtrackTimer) {
        clearTimeout(soundtrackTimer);
        soundtrackTimer = null;
    }
}

function playSoundtrack() {
    ensureAudio();
    if (musicPlaying) return;
    musicPlaying = true;

    const stepMs = (60 / soundtrack.tempo) * 1000 / 2;

    const tick = () => {
        if (!gameState.isStarted || gameState.isGameOver || gameState.isPaused) {
            stopSoundtrack();
            return;
        }

        const s = soundtrack.step;
        const melodyNote = soundtrack.melody[s % soundtrack.melody.length];
        const bassNote = soundtrack.bass[s % soundtrack.bass.length];
        const chordNote = soundtrack.chords[Math.floor(s / 4) % soundtrack.chords.length];

        if (melodyNote) playTone(melodyNote, 0.15, 'square', 0.045);
        if (s % 2 === 0) playTone(bassNote, 0.18, 'triangle', 0.05);
        if (s % 4 === 0) {
            playTone(chordNote, 0.22, 'sawtooth', 0.018);
            playTone(chordNote * 1.25, 0.18, 'sawtooth', 0.014, 0.01);
        }
        if (s % 4 === 0) playNoise(0.04, 0.018, 0, 1800);
        if (s % 4 === 2) playNoise(0.02, 0.012, 0, 900);

        soundtrack.step = (soundtrack.step + 1) % 64;
        soundtrackTimer = setTimeout(tick, stepMs);
    };

    tick();
}

// High Score Handling
function getHighScore() {
    return localStorage.getItem('highScore') ? parseInt(localStorage.getItem('highScore')) : 0;
}

function setHighScore(score) {
    const currentHigh = getHighScore();
    if (score > currentHigh) {
        localStorage.setItem('highScore', score);
    }
}

// --- 1. DEFINE THE FUNCTION FIRST (Before any other logic that might use it) ---
function resetGameGlobal() {
    console.log("Restarting Game..."); // Debug log
    
    gameState.isGameOver = false;
    gameState.isPaused = false;
    gameState.score = 0;
    gameState.level = 1;
    gameState.gameOverReason = '';
    gameState.particles = [];
    gameState.portalParticleTimer = 0;
    hearts = [];
    stompChain = 0;

    player.health = 3;
    player.invincible = false;
    player.invincibleTimer = 0;
    
    // Spawn on the ground (Start of level 1)
    player.x = 50;
    player.y = 360; 
    player.velX = 0;
    player.velY = 0;
    player.grounded = false;

    gameState.cameraX = 0;
    
    // Regenerate level
    generateLevel(1);

    // Play restart sound
    playBlip(880, 0.2); // Higher blip for restart
}

function startGame() {
    ensureAudio();
    gameState.isStarted = true;
    resetGameGlobal();
    soundtrack.step = 0;
    playSoundtrack();
}

// --- 2. OTHER FUNCTIONS ---
function triggerGameOver(reason) {
    console.log("Game Over: " + reason);
    stopSoundtrack();
    gameState.isGameOver = true;
    gameState.gameOverReason = reason;
    setHighScore(gameState.score);
    
    // Play game over sound: descending blips
    playBlip(880, 0.1);
    setTimeout(() => playBlip(660, 0.1), 150);
    setTimeout(() => playBlip(440, 0.2), 300);
}

// --- 3. GENERATION & LOGIC ---
function generateLevel(levelNum) {
    platforms = [];
    enemies = [];
    coins = [];
    hearts = [];
    
    // Base Floor
    platforms.push({ x: 0, y: 400, w: 300, h: 100 });
    
    let currentX = 300;
    const numSections = Math.min(12 + levelNum, 20); // Cap at 20 to prevent overly long levels

    for (let i = 0; i < numSections; i++) {
        let gapSize = Math.floor(Math.random() * 150) + 80;
        let platX = currentX + gapSize;
        let y = (Math.random() > 0.6) ? 280 : 350;
        if(levelNum === 1 && y < 300) y = 350; // Keep first level simple
        
        let width = Math.floor(Math.random() * 150) + 80;
        
        platforms.push({ x: platX, y: y, w: width, h: 120 });

        if (y > 300 && Math.random() < 0.4) {
            enemies.push({
                x: platX + 50, y: y - 30, width: 30, height: 30, color: '#306230', // Gameboy palette
                speed: 2, rangeStart: platX + 10, rangeEnd: platX + width - 40, dir: 1
            });
        }
        
        if (Math.random() < 0.7) {
            coins.push({ x: platX + width / 2 - 10, y: y - 50, size: 20, color: '#8bac0f', collected: false }); // Gameboy palette
        }
        currentX += gapSize + width;
    }

    // Final Goal
    const preGoalPlat = platforms[platforms.length - 1];
    const goalPlatform = { x: preGoalPlat.x + preGoalPlat.w + 250, y: preGoalPlat.y, w: 300, h: 120 };
    platforms.push(goalPlatform);
    
    goal = { 
        x: goalPlatform.x + goalPlatform.w / 2 - 37,
        y: goalPlatform.y - 125,
        width: 74,
        height: 125
    };
}

function update() {
    if (!gameState.isStarted || gameState.isGameOver || gameState.isPaused) return;

    // Invincibility timer
    if (player.invincible) {
        player.invincibleTimer--;
        if (player.invincibleTimer <= 0) {
            player.invincible = false;
        }
    }

    gameState.portalParticleTimer++;
    if (goal && gameState.portalParticleTimer >= 8) {
        gameState.portalParticleTimer = 0;
        createParticles(
            goal.x + goal.width / 2 + (Math.random() - 0.5) * goal.width * 0.5,
            goal.y + goal.height / 2 + (Math.random() - 0.5) * goal.height * 0.6,
            '#9bbc0f',
            1
        );
    }

    // Movement
    if (keys['ArrowRight']) player.velX = 7;
    else if (keys['ArrowLeft']) player.velX = -7;
    else player.velX *= 0.85;

    player.velY += 0.7; // Gravity
    player.x += player.velX;
    player.y += player.velY;

    // Death Pit Check
    if (player.y > canvas.height + 200) {
        triggerGameOver("FALLING INTO THE ABYSS");
        return;
    }

    // Stuck Prevention: If player falls below platforms without grounding for too long, respawn
    if (!player.grounded && player.velY > 0 && player.y > 400) {
        // Simple respawn to last safe position (e.g., start of level)
        player.x = 50;
        player.y = 360;
        player.velY = 0;
        player.health--;
        if (player.health <= 0) {
            triggerGameOver("STUCK IN ABYSS");
        }
        playBlip(330, 0.2, 'sawtooth'); // Hurt sound
    }

    // Prevent going left off the first platform
    if (player.x < 0) {
        player.x = 0;
        player.velX = 0;
    }

    // Camera Follow
    let targetCamX = player.x - canvas.width / 2.5;
    if (targetCamX < 0) targetCamX = 0;
    gameState.cameraX += (targetCamX - gameState.cameraX) * 0.1;

    // Platform Collision
    player.grounded = false;
    platforms.forEach(plat => {
        if (
            player.x < plat.x + plat.w &&
            player.x + player.width > plat.x &&
            player.y < plat.y + plat.h &&
            player.y + player.height > plat.y
        ) {
            let overlapY = (player.y + player.height) - plat.y;
            // Landing on top
            if (overlapY < 30 && player.velY >= 0) {
                const landingSpeed = player.velY;
                player.y = plat.y - player.height;
                player.velY = 0;
                player.grounded = true;
                if (landingSpeed > 6) playBlip(220, 0.05, 'triangle');
            }
        }
    });

    // Enemy Logic
    enemies.forEach(enemy => {
        enemy.x += enemy.speed * enemy.dir;
        if (enemy.x <= enemy.rangeStart || enemy.x >= enemy.rangeEnd) enemy.dir *= -1;

        if (
            player.x < enemy.x + enemy.width &&
            player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height &&
            player.y + player.height > enemy.y
        ) {
            // Stomp Check
            if (player.velY > 0 && player.y + player.height < enemy.y + enemy.height / 2) {
                createParticles(enemy.x + 15, enemy.y + 15, '#306230', 10); // Gameboy palette
                let index = enemies.indexOf(enemy);
                if (index > -1) enemies.splice(index, 1);
                player.velY = -10;
                gameState.score += 50;
                stompChain++;
                const mercyDrop = player.health < 3 && stompChain >= 8;
                spawnHeart(enemy.x + enemy.width / 2 - 11, enemy.y - 26, mercyDrop);
                if (mercyDrop) stompChain = 0;
                // Play stomp sound
                playBlip(660, 0.1, 'sawtooth');
            } else if (!player.invincible) {
                player.health--;
                stompChain = 0;
                playBlip(330, 0.2, 'sawtooth'); // Hurt sound
                player.velY = -8; // Knockback
                player.velX = (player.x > enemy.x) ? 5 : -5;
                player.invincible = true;
                player.invincibleTimer = 60; // 1 second invincibility
                if (player.health <= 0) {
                    triggerGameOver("KILLED BY SPIKE");
                }
            }
        }
    });

    // Heart Logic
    hearts = hearts.filter(heart => heart.life > 0);
    hearts.forEach(heart => {
        heart.life--;
        heart.bob += 0.08;
        heart.y = heart.baseY + Math.sin(heart.bob) * 3;

        if (
            player.health < 3 &&
            player.x < heart.x + heart.width &&
            player.x + player.width > heart.x &&
            player.y < heart.y + heart.height &&
            player.y + player.height > heart.y
        ) {
            player.health++;
            heart.life = 0;
            createParticles(heart.x + heart.width / 2, heart.y + heart.height / 2, '#9bbc0f', 8);
            playBlip(523, 0.06, 'triangle');
            setTimeout(() => playBlip(784, 0.12, 'square'), 40);
        }
    });

    // Coin Logic
    coins.forEach(coin => {
        if (!coin.collected) {
            let cX = coin.x + 10, pX = player.x + 20;
            let cY = coin.y + 10, pY = player.y + 20;
            if (Math.abs(pX - cX) < 30 && Math.abs(pY - cY) < 30) {
                coin.collected = true;
                gameState.score += 10;
                createParticles(coin.x, coin.y, '#8bac0f', 5); // Gameboy palette
                // Play coin sound: ascending blips
                playBlip(440, 0.05);
                setTimeout(() => playBlip(660, 0.05), 50);
                setTimeout(() => playBlip(880, 0.1), 100);
            }
        }
    });

    // Goal Logic
    if (
        player.x < goal.x + goal.width &&
        player.x + player.width > goal.x &&
        player.y < goal.y + goal.height &&
        player.y + player.height > goal.y
    ) {
        gameState.level++;
        gameState.score += 100;
        resetLevel();
        // Play level complete sound
        playBlip(440, 0.1);
        setTimeout(() => playBlip(660, 0.1), 150);
        setTimeout(() => playBlip(880, 0.2), 300);
    }
}

function resetLevel() {
    player.x = 50;
    player.y = 360; // Spawn on first platform
    player.velX = 0;
    player.velY = 0;
    player.invincible = false;
    player.invincibleTimer = 0;
    hearts = [];
    stompChain = 0;
    gameState.cameraX = 0;
    generateLevel(gameState.level);
}

// --- INPUT HANDLING ---
const keys = {};
window.addEventListener('keydown', e => {
    if (!gameState.isStarted && e.key === ' ') {
        startGame();
        return;
    }
    if (gameState.isGameOver && e.key === ' ') {
        gameState.isStarted = true;
        gameState.isGameOver = false;
        resetGameGlobal();
        soundtrack.step = 0;
        playSoundtrack();
        return;
    }
    if (e.key === 'Escape' || e.key === 'p') {
        gameState.isPaused = !gameState.isPaused;
    }
    if (gameState.isPaused || !gameState.isStarted) return;

    if ((e.key === 'ArrowUp' || e.key === ' ') && player.grounded && !gameState.isGameOver) {
        player.velY = -14;
        player.grounded = false;
        // Play jump sound
        playBlip(660, 0.1, 'triangle');
    }
    keys[e.key] = true;
});
window.addEventListener('keyup', e => keys[e.key] = false);
canvas.addEventListener('click', () => canvas.focus());

// Gamepad Support
let gamepadConnected = false;
window.addEventListener('gamepadconnected', (e) => {
    gamepadConnected = true;
    console.log('Gamepad connected');
});
window.addEventListener('gamepaddisconnected', (e) => {
    gamepadConnected = false;
    console.log('Gamepad disconnected');
});

function handleGamepad() {
    if (!gamepadConnected) return;

    const gamepads = navigator.getGamepads();
    if (gamepads[0]) {
        const gp = gamepads[0];

        if (!gameState.isStarted) {
            if (gp.buttons[0].pressed) { // A button to start
                startGame();
            }
            return;
        }

        if (gameState.isGameOver) {
            if (gp.buttons[0].pressed) { // A button to restart
                gameState.isStarted = true;
                gameState.isGameOver = false;
                resetGameGlobal();
                soundtrack.step = 0;
                playSoundtrack();
            }
            return;
        }

        if (gameState.isPaused) {
            if (gp.buttons[9].pressed) { // Start button to resume
                gameState.isPaused = false;
                playSoundtrack();
            }
            return;
        }

        if (gp.buttons[9].pressed) { // Start button to pause
            gameState.isPaused = true;
        }

        if (gameState.isPaused || !gameState.isStarted) return;

        // Movement
        const horiz = gp.axes[0];
        if (Math.abs(horiz) > 0.1) {
            player.velX = horiz * 7;
        } else {
            player.velX *= 0.85;
        }

        // Jump
        if (gp.buttons[0].pressed && player.grounded) { // A button
            player.velY = -14;
            player.grounded = false;
            playBlip(660, 0.1, 'triangle');
        }
    }
}

// --- PARTICLES ---
function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) gameState.particles.push({
        x: x, y: y, color: color,
        size: Math.random() * 5 + 2,
        speedX: (Math.random() - 0.5) * 6,
        speedY: (Math.random() - 0.5) * 6,
        life: 1.0
    });
}

function spawnHeart(x, y, forceDrop = false) {
    if (player.health >= 3 && !forceDrop) return;

    const shouldDrop = forceDrop || Math.random() < 0.25;
    if (!shouldDrop) return;

    hearts.push({
        x: x,
        y: y,
        width: 22,
        height: 22,
        baseY: y,
        bob: Math.random() * Math.PI * 2,
        life: 360
    });
}

// Function to draw a nicer heart
function drawHeart(x, y, size, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y + size / 4);
    ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + size / 4);
    ctx.bezierCurveTo(x - size / 2, y + size / 2, x, y + size * 3 / 4, x, y + size);
    ctx.bezierCurveTo(x, y + size * 3 / 4, x + size / 2, y + size / 2, x + size / 2, y + size / 4);
    ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + size / 4);
    ctx.fill();
}

// Function to draw portal
function drawPortal(x, y, width, height) {
    const t = Date.now() * 0.003;
    const cx = x + width / 2;
    const cy = y + height / 2;

    // stone uprights and lintel
    ctx.fillStyle = '#306230';
    ctx.fillRect(x - 14, y - 8, 14, height + 12);
    ctx.fillRect(x + width, y - 8, 14, height + 12);
    ctx.fillRect(x - 18, y - 20, width + 36, 18);
    ctx.fillStyle = '#0f380f';
    ctx.fillRect(x - 10, y - 15, width + 20, 6);

    // base slab so it feels planted on the platform, not buried
    ctx.fillStyle = '#306230';
    ctx.fillRect(x - 8, y + height, width + 16, 8);

    // clip interior to doorway shape
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, width, height);
    ctx.clip();

    // dark portal fill
    ctx.fillStyle = '#001100';
    ctx.fillRect(x, y, width, height);

    // green/black swirling spiral bands
    for (let i = 0; i < 26; i++) {
        const p = i / 26;
        const radius = p * (width * 0.78);
        const angle = t + p * 14;
        const px = cx + Math.cos(angle) * radius * 0.55;
        const py = cy + Math.sin(angle) * radius * 0.9;
        ctx.fillStyle = i % 2 === 0 ? '#9bbc0f' : '#0f380f';
        const bandW = Math.max(6, (1 - p) * width * 0.26);
        const bandH = Math.max(5, (1 - p) * height * 0.14);
        ctx.fillRect(px - bandW / 2, py - bandH / 2, bandW, bandH);
    }

    // inner glow rings
    ctx.strokeStyle = '#8bac0f';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        const wobble = Math.sin(t * 2 + i) * 2;
        ctx.ellipse(cx, cy, width * (0.18 + i * 0.12), height * (0.12 + i * 0.1) + wobble, t + i * 0.5, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.restore();

    // glow edge
    ctx.strokeStyle = '#9bbc0f';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, width, height);

}


// --- DRAWING ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameState.isStarted) {
        // Title/Start Screen
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = 'bold 50px Courier New';
        ctx.fillStyle = '#9bbc0f';
        ctx.textAlign = 'center';
        ctx.fillText('Super Basic Platformer v1', canvas.width / 2, canvas.height / 2 - 100);

        ctx.font = 'bold 30px Courier New';
        ctx.fillText(`High Score: ${getHighScore()}`, canvas.width / 2, canvas.height / 2 - 30);

        ctx.font = 'bold 20px Courier New';
        ctx.fillText('Press SPACE or A on Gamepad to Start', canvas.width / 2, canvas.height / 2 + 50);

        // Apply scanlines and tint
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        for (let i = 0; i < canvas.height; i += 2) {
            ctx.fillRect(0, i, canvas.width, 1);
        }
        ctx.fillStyle = 'rgba(143, 188, 15, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        return;
    }

    if (gameState.isPaused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = 'bold 60px Courier New';
        ctx.fillStyle = '#9bbc0f';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 50);

        ctx.font = 'bold 20px Courier New';
        ctx.fillText('Press ESC, P or Start on Gamepad to Resume', canvas.width / 2, canvas.height / 2 + 50);

        // Apply scanlines and tint
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        for (let i = 0; i < canvas.height; i += 2) {
            ctx.fillRect(0, i, canvas.width, 1);
        }
        ctx.fillStyle = 'rgba(143, 188, 15, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        return;
    }

    if (gameState.isGameOver) {
        // Draw Game Over on canvas in Gameboy style
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)'; // Semi-transparent overlay
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = 'bold 60px Courier New';
        ctx.fillStyle = '#9bbc0f'; // Light green
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 100);

        ctx.font = 'bold 30px Courier New';
        ctx.fillText(`Score: ${gameState.score}`, canvas.width / 2, canvas.height / 2 - 30);
        ctx.fillText(`High Score: ${getHighScore()}`, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText(gameState.gameOverReason, canvas.width / 2, canvas.height / 2 + 50);

        ctx.font = 'bold 20px Courier New';
        ctx.fillText('Press SPACE or A on Gamepad to TRY AGAIN', canvas.width / 2, canvas.height / 2 + 100);

        // Apply scanlines to game over screen too
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        for (let i = 0; i < canvas.height; i += 2) {
            ctx.fillRect(0, i, canvas.width, 1);
        }

        // Green tint
        ctx.fillStyle = 'rgba(143, 188, 15, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        return; // Don't draw game elements
    }

    ctx.save();
    ctx.translate(-gameState.cameraX, 0);

    platforms.forEach(p => {
        ctx.fillStyle = '#306230'; // Gameboy ground
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#8bac0f'; // Gameboy grass
        ctx.fillRect(p.x, p.y, p.w, 15);
        ctx.strokeStyle = '#0f380f'; // Dark outline
        ctx.strokeRect(p.x, p.y, p.w, p.h);
    });

    // Draw Portal
    drawPortal(goal.x, goal.y, goal.width, goal.height);

    // Draw Coins
    coins.forEach(c => {
        if (!c.collected) {
            ctx.fillStyle = c.color;
            ctx.beginPath(); ctx.arc(c.x, c.y, c.size/2, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#0f380f"; ctx.textAlign = "center"; ctx.fillText("$", c.x, c.y + 5);
        }
    });

    // Draw Enemies
    enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath(); 
        ctx.moveTo(e.x, e.y + e.height); 
        ctx.lineTo(e.x + e.width/2, e.y); 
        ctx.lineTo(e.x + e.width, e.y + e.height); 
        ctx.fill();
    });

    // Draw Heart Drops
    hearts.forEach(h => {
        const pulse = 1 + Math.sin(h.bob * 2) * 0.08;
        ctx.save();
        ctx.translate(h.x + h.width / 2, h.y + h.height / 2);
        ctx.scale(pulse, pulse);
        drawHeart(0, -h.height / 2, 20, '#9bbc0f');
        ctx.strokeStyle = '#0f380f';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
    });

    // Draw Player (Only if alive and not Game Over)
    if (!gameState.isGameOver && player.health > 0) {
        // Blink if invincible
        if (!player.invincible || (player.invincibleTimer % 10 < 5)) {
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15; ctx.shadowColor = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Face
            ctx.fillStyle = "#0f380f"; // Dark features
            let facingRight = player.velX > 0.5;
            let eyeOffset = facingRight ? 24 : 6;
            ctx.fillRect(player.x + eyeOffset, player.y + 10, 8, 8);
            if (player.grounded) {
                ctx.fillRect(player.x + eyeOffset + (facingRight ? -14 : 14), player.y + 10, 8, 8); 
                ctx.fillRect(player.x + 15, player.y + 30, 6, 4);
            } else {
                ctx.beginPath(); ctx.arc(player.x + 20, player.y + 30, 4, 0, Math.PI * 2); ctx.fill();
            }
        }
    }

    // Draw Particles
    gameState.particles = gameState.particles.filter(p => p.life > 0);
    gameState.particles.forEach(p => {
        p.x += p.speedX; p.y += p.speedY; p.life -= 0.05;
        if (p.life > 0) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            ctx.globalAlpha = 1.0;
        }
    });
    
    ctx.restore();

    // HUD
    if (!gameState.isGameOver) {
        ctx.fillStyle = "#9bbc0f"; // Light HUD
        ctx.font = "20px Courier New";
        ctx.textAlign = "left";
        ctx.fillText(`Score: ${gameState.score}`, 20, 30);
        ctx.fillText(`Level: ${gameState.level}`, 20, 55);
        if (player.health < 3) ctx.fillText('SPIKES MAY DROP HEARTS', 20, 80);

        // Draw nicer hearts for health
        for (let i = 0; i < 3; i++) {
            const heartColor = (i < player.health) ? '#9bbc0f' : '#306230'; // Full or empty
            drawHeart(canvas.width - 60 - i * 30, 20, 20, heartColor);
        }
    }

    // Add Gameboy-like interlacing (scanlines) effect
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // Semi-transparent black for scanlines
    for (let i = 0; i < canvas.height; i += 2) {
        ctx.fillRect(0, i, canvas.width, 1);
    }

    // Optional: Add a greenish tint overlay for Gameboy feel
    ctx.fillStyle = 'rgba(143, 188, 15, 0.1)'; // Light green tint
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// --- INITIALIZATION ---
function init() {
    // Initial level generation not needed until start
    function loop() {
        handleGamepad();
        update();
        draw();
        requestAnimationFrame(loop);
    }
    loop();
}

init();

</script>
</body>
</html>
